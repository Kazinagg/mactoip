[project]
name = "mactoip"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kazinagg", email = "92749742+Kazinagg@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
mactoip = "mactoip.main:start"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
